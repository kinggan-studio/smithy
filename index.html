<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0a07">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="炉火铁匠铺">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>炉火铁匠铺</title>
<style>
:root{
  --bg:#0f0a07;--panel:#1c120d;--line:#4a3222;--line2:#6b4a30;
  --text:#f3e7d3;--dim:#c2ad95;--ember:#ff7a1a;--glow:#ffb347;--gold:#f2c14e;
  --danger:#ff4a2b;--frenzy:#7fd4ff;--ok:#7bd88f;--great:#ffd36a;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  overflow-x:hidden;overflow-y:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(8,5,3,.78) 0%,rgba(8,5,3,.35) 14%,rgba(8,5,3,0) 26%,rgba(8,5,3,0) 62%,rgba(8,5,3,.55) 78%,rgba(8,5,3,.86) 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top)) 12px max(16px,calc(env(safe-area-inset-bottom) + 10px));gap:7px}
button{font:inherit;color:inherit;border:1px solid var(--line);background:linear-gradient(180deg,#2a1a11,#1c120d);
  border-radius:12px;padding:9px 12px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,220,170,.08),0 4px 10px rgba(0,0,0,.35)}
button:disabled{opacity:.42;cursor:default}
button:active:not(:disabled){transform:translateY(1px)}
.grow{flex:1;min-width:0}.dim{color:var(--dim)}.gold{color:var(--gold)}
.num{font-family:var(--serif);font-weight:900;font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:8px}
.top{text-shadow:0 2px 0 rgba(0,0,0,.6)}
.brand{font-family:var(--serif);font-weight:900;font-size:21px;letter-spacing:.18em;line-height:1;
  background:linear-gradient(180deg,#ffe2a0,#ff8a2a 70%,#c2410c);-webkit-background-clip:text;background-clip:text;color:transparent}
.daypill{margin-left:auto;font-size:13px;color:var(--text);padding:5px 11px;border-radius:99px;border:1px solid var(--line2);background:rgba(28,18,13,.8)}
.daypill b{font-family:var(--serif);color:var(--gold)}
.icon{width:34px;height:34px;padding:0;border-radius:10px;font-size:15px;display:grid;place-items:center}

.ledger{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r);
  background:linear-gradient(160deg,#341521 0%,#1a0e12 60%);border:1px solid #5a2640;
  box-shadow:inset 0 1px 0 rgba(255,200,200,.07),inset 0 0 30px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4)}
.eyewrap{width:54px;flex:none;display:grid;place-items:center}
.logo.rankbadge{border:0;border-radius:0;box-shadow:none;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.65))}
.logo.up{animation:rankup 1s ease-out}
@keyframes rankup{0%{transform:scale(.4) rotate(-20deg);filter:brightness(2.4)}55%{transform:scale(1.35) rotate(6deg);filter:brightness(1.6) drop-shadow(0 0 14px #ffd36a)}100%{transform:scale(1)}}
.logo{width:54px;height:54px;border-radius:13px;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--edge),0 3px 0 var(--ink);display:block}
.eye{width:54px;height:36px;filter:drop-shadow(0 0 7px rgba(255,60,60,.6))}
.eye.a1{filter:saturate(1.3) drop-shadow(0 0 9px rgba(255,50,50,.85))}
.eye.a2{filter:saturate(1.8) hue-rotate(-14deg) drop-shadow(0 0 13px rgba(255,30,30,1));animation:throb 1s infinite alternate}
@keyframes throb{to{transform:scale(1.08)}}
.l-title{font-size:12px;color:var(--dim);letter-spacing:.1em}
.l-q{display:flex;align-items:baseline;gap:6px;line-height:1.1}
.l-q b{font-size:26px;color:var(--gold)}.l-q small{color:var(--dim);font-size:11px}
.pbar{height:7px;border-radius:99px;background:#150b10;border:1px solid #3a1d2a;overflow:hidden;margin:5px 0 4px}
.pbar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#c2410c,#f2c14e);transition:width .2s}
.pbar.ok>i{background:linear-gradient(90deg,#2f9e5a,#9be28f)}
.l-foot{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);white-space:nowrap}
.flames{display:flex;gap:1px;margin-left:auto}
.fl{width:15px;height:15px;color:#3b2a2f;transition:color .3s,filter .3s}
.fl.on{color:var(--danger);filter:drop-shadow(0 0 5px rgba(255,74,43,.9))}
.wax{width:62px;height:62px;flex:none;border-radius:50%;padding:0;border:none;font-family:var(--serif);font-weight:900;font-size:14px;line-height:1.15;
  color:#ffe1bd;text-shadow:0 1px 0 #3d0d28,0 -1px 0 rgba(255,255,255,.25);
  background:radial-gradient(circle at 34% 28%,#d6527a,#8d1e45 58%,#4a0c26);
  box-shadow:inset 0 2px 3px rgba(255,200,200,.35),inset 0 -5px 8px rgba(0,0,0,.45),0 0 0 3px rgba(74,12,38,.6),0 6px 14px rgba(0,0,0,.5)}
.wax.ready{animation:ready 1.1s infinite alternate}
@keyframes ready{to{box-shadow:inset 0 2px 3px rgba(255,200,200,.35),inset 0 -5px 8px rgba(0,0,0,.45),0 0 0 3px rgba(255,160,160,.7),0 0 22px rgba(255,80,120,.8)}}

.stage{position:relative;flex:100 1 150px;min-height:150px;border-radius:var(--r);overflow:hidden;background:transparent}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;background:radial-gradient(circle,transparent 30%,rgba(255,40,40,.55));transition:opacity .15s}
.stage.flash::after{opacity:1}
#cv{position:fixed;left:0;top:0;width:100vw;height:100dvh;display:block;z-index:0;pointer-events:none}
.odds{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;pointer-events:none}
.odds div{text-align:center;padding:3px 0 2px;border-radius:8px;border:1px solid var(--line);background:rgba(15,10,7,.78);font-size:11px;color:var(--dim);line-height:1.2}
.odds b{display:block;font-family:var(--serif);font-size:13px;color:var(--text);line-height:1.15}
.odds .brk b{color:var(--danger)}.odds .grt b{color:var(--great)}.odds .suc b{color:var(--ok)}
.odds.fz div{border-color:var(--frenzy)}
.swinfo{position:absolute;left:10px;bottom:34px;pointer-events:none;text-shadow:0 2px 0 #000;background:rgba(15,10,7,.72);border:2px solid #0b0508;border-radius:8px;padding:3px 9px 4px}
.swinfo .g{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--gold);line-height:1}
.swinfo .v{font-size:12px;color:var(--dim)}
.pips{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:4px;align-items:center}
.pips i{flex:1;height:8px;border-radius:3px;background:#2a1b14;border:1px solid #3d2a1d}
.pips i.on{background:linear-gradient(180deg,#9fe0ff,#3a8fc0);border-color:#7fd4ff;box-shadow:0 0 8px rgba(127,212,255,.6)}
.pips.fz i{background:linear-gradient(180deg,#cfeeff,#7fd4ff);box-shadow:0 0 10px var(--frenzy)}
.fzbar{position:absolute;left:10px;right:10px;bottom:22px;height:6px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden;display:none}
.fzbar i{display:block;height:100%;background:linear-gradient(90deg,#3a8fc0,#cfeeff);width:100%}
.float{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-family:var(--serif);font-weight:900;font-size:24px;
  text-shadow:0 2px 0 rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.8);pointer-events:none;animation:up .95s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.noanvil[hidden]{display:none}
.noanvil{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);font-size:14px;pointer-events:none;padding:0 40px;line-height:1.6}

.tray{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 3px;scrollbar-width:none;min-height:40px}
.tray::-webkit-scrollbar{display:none}
.sw{flex:none;min-width:62px;padding:5px 8px;border-radius:10px;border:1px solid var(--line2);background:linear-gradient(180deg,#2c1c12,#160d08);text-align:center;line-height:1.15}
.sw b{display:block;font-family:var(--serif);font-size:15px;color:var(--text)}
.sw small{font-size:11px;color:var(--dim)}
.sw.on{border-color:var(--glow);box-shadow:0 0 10px rgba(255,170,60,.5)}
.sw.tr{border-color:#d6527a}
.sw.fz{border-color:var(--frenzy)}
.noswords{font-size:12px;color:#6c5a4a;align-self:center}
.cons{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:0}
.cons::-webkit-scrollbar{display:none}
.cn{flex:none;padding:5px 10px;border-radius:99px;border:1px solid #5b4580;background:linear-gradient(180deg,#2a2038,#17101f);font-size:12px;color:#e8d3ff}
.cn b{color:#fff}

.mainbtns{display:grid;grid-template-columns:2.2fr 1fr;gap:8px;flex:1 1 56px;max-height:128px;min-height:56px}
.mainbtns button{height:100%}
#btnStrike{position:relative;border:1px solid #ffc27a;padding:14px 8px;font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.3em;text-indent:.3em;
  color:#2a1205;text-shadow:0 1px 0 rgba(255,230,190,.5);border-radius:14px;
  background:linear-gradient(180deg,#ffb14d 0%,#ff7a1a 48%,#d9480f 100%);
  box-shadow:inset 0 2px 0 rgba(255,240,200,.65),inset 0 -4px 0 rgba(120,30,0,.35),0 0 0 1px #7c2d12,0 8px 18px rgba(255,100,20,.28)}
#btnStrike:active:not(:disabled){transform:translateY(2px)}
#btnStrike:disabled{filter:grayscale(.8) brightness(.6)}
#btnStrike .cd{position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:3px;background:rgba(0,0,0,.25);overflow:hidden}
#btnStrike .cd i{display:block;height:100%;width:0;background:rgba(255,255,255,.7)}
#btnOff{font-family:var(--serif);font-weight:900;letter-spacing:.15em}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.nav button{font-family:var(--serif);font-weight:900;letter-spacing:.1em;padding:10px 6px}
#navRelic{color:#e8d3ff;border-color:#5b4580;background:linear-gradient(180deg,#2a2038,#17101f)}
#navMer{color:#9be0c6;border-color:#2f6a56;background:linear-gradient(180deg,#143028,#0c1c17)}
#navTri{color:#ffb8cc;border-color:#8d1e45;background:linear-gradient(180deg,#3a1424,#1f0b14)}
.badge[hidden]{display:none}.badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:5px;box-shadow:0 0 8px var(--danger)}

.modal{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(40,16,24,.8),rgba(6,3,4,.94));display:flex;align-items:center;justify-content:center;padding:14px;z-index:60;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:450px;max-height:92dvh;overflow:auto;border-radius:18px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(170deg,#2b1a11,#170e09);border:1px solid var(--line2);
  box-shadow:inset 0 1px 0 rgba(255,220,170,.1),0 0 0 1px #0b0604,0 30px 60px rgba(0,0,0,.7);animation:pop .26s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.sheet h2{margin:0;font-family:var(--serif);font-weight:900;font-size:20px;letter-spacing:.08em;background:linear-gradient(180deg,#ffe2a0,#ffa040);-webkit-background-clip:text;background-clip:text;color:transparent}
.sheet h3{margin:4px 0 0;font-family:var(--serif);font-size:14px;color:var(--glow);letter-spacing:.1em}
.row{display:flex;gap:10px;align-items:center;padding:9px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#201309,#150d08)}
.row .ic{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:23px;background:radial-gradient(circle at 35% 30%,#4a3220,#1a0f08);border:1px solid var(--line2)}
.row b{display:block;font-family:var(--serif);font-size:14px}
.row small{display:block;color:var(--dim);font-size:12px;line-height:1.4}
.row.sel{border-color:var(--glow);box-shadow:0 0 12px rgba(255,170,60,.35)}
.buy{white-space:nowrap;border:1px solid #ffc27a;color:#2a1205;font-weight:800;border-radius:11px;padding:8px 12px;
  background:linear-gradient(180deg,#ffb14d,#ff7a1a 55%,#d9480f);box-shadow:inset 0 1px 0 rgba(255,240,200,.6),0 0 0 1px #7c2d12}
.buy:disabled{filter:grayscale(.9) brightness(.55);box-shadow:none}
.ghost{background:linear-gradient(180deg,#2a1a11,#1c120d);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.shelf{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.slot{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:18px;border:1px solid var(--line2);background:linear-gradient(180deg,#2c1c12,#160d08);cursor:pointer}
.slot.empty{opacity:.35;cursor:default;font-size:11px;color:var(--dim)}
.slot.sel{border-color:var(--glow);box-shadow:0 0 10px rgba(255,170,60,.6)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:13px}
.stats div{padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:#150d08}
.stats b{display:block;font-family:var(--serif);font-size:20px;color:var(--text)}
ul.rules{margin:0;padding-left:18px;line-height:1.75;font-size:13.5px}ul.rules b{color:var(--glow)}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:6px 2px}
.sum b{font-family:var(--serif);font-size:18px}
.sum.ok b{color:var(--ok)}.sum.bad b{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 170px);transform:translateX(-50%);
  background:rgba(28,18,13,.96);border:1px solid var(--glow);color:var(--glow);padding:8px 15px;border-radius:99px;font-size:14px;z-index:95;pointer-events:none;
  animation:toast 2s forwards;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.bad{border-color:var(--danger);color:#ff9a86}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ── 扁平描边风：不用高光渐变和柔光，靠粗描边、硬投影、纸面颗粒 ── */
:root{--ink:#0b0508;--wood:#2b1b12;--wood2:#3a2619;--edge:#6a4a30}
button,.buy,.ghost{background:var(--wood);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink),inset 0 0 0 1px var(--edge);border-radius:10px}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink),inset 0 0 0 1px var(--edge)}
.buy{background:#e8741c;color:#1b0a02;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink),inset 0 -3px 0 #a84a0c}
.buy.ghost,.ghost{background:var(--wood2);color:var(--text);box-shadow:0 3px 0 var(--ink),inset 0 0 0 1px var(--edge)}
.buy:disabled{filter:none;opacity:.45;background:#5a4636;color:#bba58f;box-shadow:0 3px 0 var(--ink)}
#btnStrike{background:#f0761a;color:#1b0a02;border:3px solid var(--ink);border-radius:12px;text-shadow:none;box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 #b04a0a,inset 0 3px 0 #ff9f4d}
#btnStrike:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink),inset 0 -3px 0 #b04a0a,inset 0 3px 0 #ff9f4d}
#btnStrike:disabled{filter:none;background:#6a4a34;color:#a89078}
#btnStrike .cd{background:rgba(0,0,0,.35)}
#btnCollect,#btnOff{background:var(--wood2)}
#navTool{background:#2e2540;color:#e4d4ff;border-color:var(--ink)}#navOrd{background:#40182a;color:#ffc2d4;border-color:var(--ink)}
#navGro{background:#17352b;color:#a6e6cc;border-color:var(--ink)}
#navMkt{background:#3a2e14;color:#f4d98a;border-color:var(--ink)}
.nav button{font-size:13px;padding:9px 2px}
.brand{background:none;-webkit-background-clip:initial;background-clip:initial;color:#f2b24a;text-shadow:2px 2px 0 var(--ink);filter:none}
.sheet h2{background:none;-webkit-background-clip:initial;background-clip:initial;color:#f2b24a;text-shadow:2px 2px 0 var(--ink)}
.ledger{background:#2a1c10;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #6a4a26,0 4px 0 var(--ink)}
.stage{border:0;box-shadow:none;transition:box-shadow .1s}
.stage.fz{box-shadow:inset 0 0 0 3px rgba(127,212,255,.85),inset 0 0 46px rgba(127,212,255,.45)}
.sheet{background:#231710;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--edge),0 8px 0 var(--ink)}
.row,.sw,.slot,.odds div,.cn,.stats div,.daypill,.chip{background:#1d130d;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.row .ic{background:#33241a;border:2px solid var(--ink)}
.row.sel,.sw.on{box-shadow:inset 0 0 0 2px var(--glow)}
.sw.tr{box-shadow:inset 0 0 0 2px #d6527a}
.wax{background:#b4561a;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 #7a3408,inset 0 3px 0 #e88a46;text-shadow:1px 1px 0 var(--ink)}
.wax:active{transform:translateY(3px)}
.wax.ready{animation:waxr .6s infinite alternate}@keyframes waxr{to{background:#e8741c}}
.pbar>i,.sand>i{box-shadow:none}
.toast{border:2px solid var(--ink);background:#2a1a10;box-shadow:0 3px 0 var(--ink)}
.modal{background:rgba(8,4,6,.86)}
.combo{position:absolute;right:14px;top:56px;display:none;font-family:var(--serif);font-weight:900;font-size:46px;color:#dff4ff;line-height:1;pointer-events:none;
  text-shadow:3px 3px 0 #0b0508,0 0 18px #7fd4ff;transform-origin:right center}
.combo.pop{animation:combopop .12s ease-out}
@keyframes combopop{0%{transform:scale(1.55) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
.mini{width:16px;height:16px;vertical-align:-3px}
.ico{width:100%;height:100%;object-fit:contain;display:block}
.cn .ico{width:18px;height:18px;display:inline-block;vertical-align:-4px}
.slot .ico{width:80%;height:80%}
.row .ic{overflow:hidden;font-size:23px;width:48px;height:48px}.row .ic .ico{width:94%;height:94%}
.pt{width:52px;height:52px;border-radius:10px;border:2px solid var(--ink);background:#33241a;object-fit:cover;flex:none}

/* ── 第二轮 UX ── */
.rentnote{margin-left:4px;font-size:11px;color:var(--ok)}.rentnote.bad{color:#ffb09c}
.rbar{height:4px;border-radius:9px;background:#150d08;margin-top:5px;overflow:hidden}.rbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6420,#f2c14e);border-radius:9px}
.flab{font-style:normal;font-size:10px;color:var(--dim);margin-right:3px;align-self:center}
.swinfo{left:8px;bottom:38px;padding:2px 8px 3px;max-width:56%}.swinfo .g{font-size:24px}.swinfo .v{font-size:11px;line-height:1.35}.swinfo .pf{font-weight:700}.pf.up{color:#9be28f}.pf.down{color:#ff9a86}
.pips{align-items:center}.piplab{font-size:10px;color:#9fdcff;margin-right:2px;text-shadow:0 1px 0 #000;letter-spacing:.1em}
.toolrow{position:absolute;right:8px;bottom:34px;display:flex;gap:3px}
.toolrow .tl{width:25px;height:25px;border-radius:7px;border:2px solid var(--ink);background:#1d130d;display:grid;place-items:center;padding:0;overflow:hidden;box-shadow:inset 0 0 0 1px var(--edge)}
.toolrow .tl img{width:90%;height:90%;object-fit:contain}.toolrow .tl.em{opacity:.35;background:#0f0a07}
.coach{position:absolute;left:8px;right:8px;top:62px;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:#2a1a10;border:2px solid var(--glow);color:var(--text);font-size:13px;line-height:1.45;z-index:5;box-shadow:0 4px 0 var(--ink)}
.coach[hidden]{display:none}.coach span{flex:1}.coach button{padding:6px 10px;font-size:12px;white-space:nowrap}
.pulse{animation:pulseGlow 1s infinite alternate;position:relative;z-index:4}
@keyframes pulseGlow{to{box-shadow:0 0 0 3px rgba(255,200,100,.95),0 0 18px rgba(255,170,60,.8)}}
.sw{display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;padding:4px 8px 5px}
.sw .sg{width:46px;height:12px;object-fit:contain}.sw .qty{position:absolute;top:2px;right:5px;font-size:11px;font-weight:700;color:var(--glow)}
.mrow .th{flex:none;width:64px;height:22px;object-fit:contain}
.mrow small b{color:#9be28f}.mrow small .lo{color:#ff9a86}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);background:#1d130d;box-shadow:inset 0 0 0 1px var(--edge)}
.tog button{min-width:64px;padding:6px 10px}.tog button.on{background:#e8741c;color:#1b0a02}
@media (min-width:700px){#app{min-height:780px}}

</style>

<body>
<canvas id="cv"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><radialGradient id="eg" cx="50%" cy="50%" r="62%"><stop offset="0" stop-color="#ffd0a0"/><stop offset=".5" stop-color="#ff3a2a"/><stop offset="1" stop-color="#60101c"/></radialGradient>
  <symbol id="flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 1.5c.8 4.2 6.2 6.6 6.2 12.6A6.7 6.7 0 0 1 12 21a6.7 6.7 0 0 1-6.7-6.9c0-3 1.8-4.6 3.2-7.4.9 1 1.7 2 1.9 3.9 1.3-2.8 1.8-6.2 2.1-9.1z"/></symbol></defs>
</svg>

<main id="app">
  <div class="top">
    <div class="brand">炉火铁匠铺</div>
    <div class="daypill" id="daypill">第 <b id="dayno">1</b> 天</div>
    <button class="icon" id="mute" aria-label="音效">🔊</button>
    <button class="icon" id="gear" aria-label="设置">⚙️</button>
    <button class="icon" id="help" aria-label="说明">?</button>
  </div>

  <section class="ledger">
    <div class="eyewrap"><img class="logo rankbadge" id="rankimg" src="art/ranks/0.png" alt="" onerror="this.onerror=null;this.src='icon-192.png'"></div>
    <div class="grow">
      <div class="l-title" id="ranktitle">学徒 · 今日房租</div>
      <div class="l-q"><b class="num" id="rent">150</b><small>G</small><small class="rentnote" id="rentnote"></small></div>
      <div class="pbar" id="pbar" title="金币够不够交今天的房租"><i id="pfill"></i></div>
      <div class="l-foot"><span><img class="mini" src="art/icons/coin.png" alt="" onerror="this.style.display='none'"> <b class="gold num" id="gold">0</b></span><span>总资产 <b class="gold num" id="worth">0</b></span>
        <span class="flames" id="flames" title="欠租次数：满 3 次铺子就被收走了"><em class="flab">欠租</em><svg class="fl"><use href="#flame"/></svg><svg class="fl"><use href="#flame"/></svg><svg class="fl"><use href="#flame"/></svg></span></div>
      <div class="rbar" id="rbar" title="总资产离下一个名号还有多远"><i id="rfill"></i></div>
    </div>
    <button class="wax" id="wax">结束<br>今天</button>
  </section>

  <section class="stage" id="stage">
    <div class="odds" id="odds"></div>
    <div class="swinfo" id="swinfo"></div>
    <div class="combo" id="combo"></div>
    <div class="fzbar" id="fzbar"><i id="fzfill"></i></div>
    <div class="toolrow" id="toolrow"></div>
    <div class="pips" id="pips"></div>
    <div class="coach" id="coach" hidden><span id="coachtxt"></span><button id="coachok">知道了</button></div>
    <div class="noanvil" id="empty" hidden>铁砧上没有剑<br>点下面的剑放上来，或去市场买</div>
  </section>

  <div class="tray" id="tray"></div>
  <div class="cons" id="cons"></div>

  <div class="mainbtns">
    <button id="btnStrike">锻打<span class="cd"><i id="cdfill"></i></span></button>
    <button id="btnOff">放下</button>
  </div>
  <div class="nav">
    <button id="navMkt">市场</button>
    <button id="navOrd">订单<span class="badge" id="obadge" hidden></span></button>
    <button id="navTool">工具<span class="badge" id="tbadge" hidden></span></button>
    <button id="navGro">杂货<span class="badge" id="gbadge" hidden></span></button>
  </div>
</main>

<script id="logic">
// ───────── 规则（纯逻辑，无 DOM，可在 node 里测试）─────────
// 炉火铁匠铺：买进武器 → 锻造 → 卖出 / 交订单；每天付房租，欠租 3 次破产。规则、符物、数值均为本项目原创设计。
const Forge = (() => {
  const BASE = 260, GROWTH = 1.42, GREAT_MUL = 1.08, SHELF = 7, MAX_MISS = 3, START_GOLD = 1600, DAILY_SWORDS = 3;
  const STRIKE_CD = 0.6, FRENZY_CD = 0.05, FRENZY_NEED = 8, FRENZY_SEC = 5, HITS_PER_LEVEL = 6, HIT_GAIN = 0.004, GROCER_EVERY = 4;
  const BUY_MARKUP = 1.3, SELL_RATE = 0.85, TOOL_UNIT = 500;
  const RANKS = [[0, '学徒'], [15000, '匠人'], [80000, '名匠'], [400000, '宗师'], [2000000, '传奇']];
  const U = { damage: 3, hold: 4, success: 10, great: 3 };
  const breakP = (g) => (g <= 0 ? 0 : 0.6 * (1 - Math.exp(-g / 9.5)));
  const R = (id, name, icon, desc, day, cost) => ({ id, name, icon, desc, day, cost });
  const RELICS = [
    R('spark_dust','火星粉','✨','精进签 +3',1,1),
    R('meteor_sand','流星砂','☄️','飞跃签 +1',1,1),
    R('calm_ring','静心环','⭕','平稳签 +2；连续 2 次平稳，+1 级',1,1),
    R('ledger_pen','账房笔','🖋️','每次精进或飞跃，该剑价值 +80G',1,1),
    R('scar_wrap','疤痕绷带','🩹','每次磨损，该剑崩裂率 −12%（最多 −48%）',3,2),
    R('bank_seed','蓄势种子','🌱','每次平稳，为下一次飞跃蓄 +1 级（最多 +3）',3,2),
    R('frost_pin','霜针','📍','崩裂概率 ×0.92',2,1),
    R('rivet','铆钉','🔩','少 3 张崩裂签',3,1),
    R('soot_mark','煤烟印','🌫️','爆燃外每次精进/飞跃，该剑崩裂率 −2.5%（最多 −15%）',3,1),
    R('snare_wire','缚线套','🪢','每天第一次崩裂，改为磨损',4,2),
    R('spark_brand','电光烙印','⚡','飞跃后，下一锤崩裂率 ×0.65',4,1),
    R('iron_gloves','铁手甲','🥊','+7 及以上，崩裂概率 ×0.78',5,2),
    R('ash_feather','灰烬羽','🪶','每把剑一次：挡住崩裂，该剑价值 ×0.65',6,3),
    R('empty_bowl','空碗','🥣','每次平稳，该剑永久 +1 张飞跃签',6,3),
    R('loaded_die','灌铅骰','🎲','平稳或磨损后，下一锤飞跃签 +2',3,1),
    R('red_string','红绳','🧶','平稳后，下一锤崩裂率 ×0.85',2,1),
    R('lead_weight','铅坠','⚓','平稳签 +2',2,1),
    R('dozing_coal','瞌睡炭','🌙','每次平稳，65% 几率 +1 级',4,3),
    R('stubborn_pledge','倔强誓约','📜','每次磨损，65% 几率 +1 级',4,2),
    R('fallen_crest','败者纹章','🛡️','每次磨损，为下一次飞跃蓄 +1 级',4,3),
    R('chain_link','连环扣','⛓️','磨损后的第一次精进/飞跃，额外 +1 级',4,2),
    R('tool_patch','补丁皮','🧷','每次磨损，该剑价值 +120G',2,1),
    R('thorn_ball','荆球','🌵','2 张平稳签变成磨损签；价值 ×1.08',3,2),
    R('glass_sand','琉璃沙','⏳','爆燃每 5 次连击就 +1 级（原本 6 次）',5,3),
    R('core_gem','炽核','💎','爆燃每次连击的价值加成翻倍',6,3),
    R('bell_ring','铃圈','🔔','爆燃结束时，该剑价值 +10%',4,2),
    R('tail_bell','余音铃','🛎️','爆燃结束时，该剑额外 +1 级',4,2),
    R('long_sand','长沙漏','⌛','爆燃时间 +1 秒',3,2),
    R('lamp_wick','长明灯芯','🕯️','爆燃时间 +2 秒',4,3),
    R('rough_grip','糙握把','🧤','锻打速度 +12%',2,1),
    R('warm_locket','暖挂坠','📿','每把剑的第一锤，爆燃充能 +2',3,2),
    R('tick_watch','滴答表','⌚','每次磨损，爆燃充能 +1',4,2),
    R('knot_sand','结沙漏','🔗','每次平稳，40% 几率爆燃充能 +1',5,2),
    R('gear_set','齿轮组','⚙️','每次精进，该剑永久 +1 张精进签',5,3),
    R('spike_rod','尖桩','📌','精进签 +5',4,2),
    R('helper_hand','帮手之手','🖐️','每连续 3 次精进/飞跃，+1 级',5,3),
    R('free_coupon','免费券','🎫','每天工具铺免费刷新 1 次',3,2),
    R('scrap_pot','废料罐','🍯','剑崩裂时，返还其最高价值 25% 的金币',2,2),
    R('discount_seal','折扣印','🏷️','市场买价 −8%',3,2),
    R('good_name','好名声','📣','订单报酬 +20%',4,3),
    R('interest_book','利息簿','📒','每天结束，金币利息 +2%',5,3),
    R('pawn_hook','当铺钩','🪝','卖价由 85% 提到 92%',4,3),
    R('extra_crate','补给箱','📦','市场每天多 2 件货',6,3),
    R('apprentice','学徒','🧑‍🔧','每天免费送你 1 把 +2 的剑',5,3),
    R('coal_bag','煤袋','⚫','基础价值 +60（同样随等级放大）',2,1),
    R('black_stone','黑石','⬛','+9 及以上，价值 ×1.25',5,2),
    R('demon_mark','金印','🏅','+13 及以上，价值 ×1.4',7,3),
    R('steel_seal','钢印','🔘','价值 ×1.12',2,1),
  ];
  const BY_ID = Object.fromEntries(RELICS.map((r) => [r.id, r]));
  const CONS = {
    ward: { id: 'ward', name: '护身符', icon: '🧿', desc: '下一锤不会崩裂（用掉不管结果）', day: 4, ratio: 0.38 },
    undo: { id: 'undo', name: '回溯沙漏', icon: '⏪', desc: '撤销上一锤，即使剑已经崩裂', day: 4, ratio: 1.4 },
    blessing: { id: 'blessing', name: '祝福粉', icon: '🌟', desc: '下一锤飞跃签翻倍', day: 8, ratio: 0.5 },
    wager: { id: 'wager', name: '对赌契', icon: '💥', desc: '下一锤：精进、飞跃都变飞跃，平稳变精进，磨损和崩裂变崩裂', day: 8, ratio: 0.85 },
    shard: { id: 'shard', name: '余火碎片', icon: '❄️', desc: '爆燃充能 +4（爆燃中不能用）', day: 8, ratio: 0.65 },
    waiver: { id: 'waiver', name: '免租券', icon: '📄', desc: '欠租次数 −1（每局一次，欠过租才出现）', day: 8, ratio: 2.0, instant: true },
  };
  const CUSTOMERS = ['老猎户', '镖局的人', '城门守卫', '路过的剑客', '酒馆老板', '赶集的富商', '佣兵团长', '年轻骑士'];

  const has = (run, id) => run.relics.includes(id);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const idx = (d) => Math.round(1200 * Math.pow(1.2, d - 1));      // 市价指数：杂货价格的基准
  const rentOf = (d) => Math.round((150 * Math.pow(1.2, d - 1)) / 10) * 10;

  // ── 剑 ──
  function newSword(run, o = {}) {
    return { id: ++run.uid, name: o.name || '铁剑', cost: o.cost || 0, grade: o.grade != null ? o.grade : 0,
      greats: 0, flat: 0, valMul: 1, baseMul: o.baseMul || 1, charge: 0, tixS: 0, tixG: 0, scars: 0, soot: 0,
      bank: 0, bank2: 0, holdStreak: 0, succStreak: 0, ashUsed: false, struckBefore: false, last: null, peak: 0 };
  }
  function valueOf(run, s) {
    const g = s.grade;
    const base = (BASE + (has(run, 'coal_bag') ? 60 : 0)) * s.baseMul;
    const v = base * Math.pow(GROWTH, g) + s.flat;
    let m = Math.pow(GREAT_MUL, s.greats) * s.valMul;
    if (has(run, 'steel_seal')) m *= 1.12;
    if (has(run, 'thorn_ball')) m *= 1.08;
    if (has(run, 'black_stone') && g >= 9) m *= 1.25;
    if (has(run, 'demon_mark') && g >= 13) m *= 1.4;
    return Math.round(v * m);
  }
  const tmpSword = (g, baseMul = 1) => ({ grade: g, baseMul, greats: 0, flat: 0, valMul: 1 });

  // ── 签库 ──
  const frenzyOn = (run, s) => !!(run.frenzy && s && run.frenzy.id === s.id && run.frenzy.left > 0);
  function oddsFor(run, s) {
    const fz = frenzyOn(run, s) || s.charge >= FRENZY_NEED;
    const u = { ...U };
    if (has(run, 'spark_dust')) u.success += 3;
    if (has(run, 'spike_rod')) u.success += 5;
    if (has(run, 'meteor_sand')) u.great += 1;
    if (has(run, 'lead_weight')) u.hold += 2;
    if (has(run, 'calm_ring')) u.hold += 2;
    u.success += s.tixS; u.great += s.tixG;
    if (run.next.die) u.great += 2;
    if (run.next.blessing) u.great *= 2;
    if (has(run, 'thorn_ball')) { const m = Math.min(2, u.hold); u.hold -= m; u.damage += m; }
    const sum = u.damage + u.hold + u.success + u.great;
    let p = 0;
    if (!fz) {
      const b = breakP(s.grade);
      let B = b > 0 ? (20 * b) / (1 - b) : 0;
      if (has(run, 'rivet')) B = Math.max(0, B - 3);
      p = B / (B + sum);
      let m = 1;
      if (has(run, 'frost_pin')) m *= 0.92;
      if (has(run, 'iron_gloves') && s.grade >= 7) m *= 0.78;
      if (has(run, 'soot_mark')) m *= 1 - 0.025 * Math.min(6, s.soot);
      if (has(run, 'scar_wrap')) m *= 1 - Math.min(0.48, 0.12 * s.scars);
      if (run.next.brand) m *= 0.65;
      if (run.next.string) m *= 0.85;
      p = clamp(p * m, 0, 0.95);
    }
    const k = (1 - p) / sum;
    return { break: p, damage: u.damage * k, hold: u.hold * k, success: u.success * k, great: u.great * k, frenzy: fz };
  }

  function newRun(rand = Math.random) {
    const run = { rand, uid: 0, day: 1, gold: START_GOLD, miss: 0, streak: 0, swords: [], anvil: null, relics: [], cons: {},
      tools: { offers: [], rerolls: 0, freeUsed: false }, market: null, orders: [], grocer: null, grocerVisits: 0, waiverUsed: false,
      dayFlags: { wire: false }, next: {}, frenzy: null, snap: null, over: false, legend: false, bankrupt: false,
      forged: 0, broken: 0, sold: 0, earned: 0, bestGrade: 0, bestSale: 0, ordersDone: 0 };
    for (let i = 0; i < DAILY_SWORDS; i++) run.swords.push(newSword(run));
    run.market = makeMarket(run); rollTools(run); refillOrders(run); snapDay(run);
    return run;
  }
  function pickN(run, pool, n) {
    const p = pool.slice(), out = [];
    while (out.length < n && p.length) out.push(p.splice(Math.floor(run.rand() * p.length), 1)[0].id);
    return out;
  }
  // ── 当天统计、批量操作、存档 ──
  const snapDay = (run) => { run.dayStart = { gold: run.gold, sold: run.sold, ordersDone: run.ordersDone, broken: run.broken, forged: run.forged, earned: run.earned }; };
  function dayReport(run) {
    const d = run.dayStart || { gold: run.gold, sold: 0, ordersDone: 0, broken: 0, forged: 0, earned: 0 }, all = [...run.swords, ...(run.anvil ? [run.anvil] : [])];
    return { goldDelta: run.gold - d.gold, sold: run.sold - d.sold, ordersDone: run.ordersDone - d.ordersDone, broken: run.broken - d.broken, forged: run.forged - d.forged,
      unsold: all.length, unsoldValue: all.reduce((a, s) => a + sellPrice(run, s), 0), fulfillable: run.orders.filter((o) => all.some((s) => s.grade >= o.grade)).length };
  }
  function sellMany(run, filter) {
    let count = 0, gold = 0;
    for (const s of run.swords.slice()) if (filter(s)) { const r = sellForGold(run, s.id); if (r.ok) { count++; gold += r.gold; } }
    return { count, gold };
  }
  function buyCheapest(run, n) {
    let bought = 0, spent = 0;
    for (let i = 0; i < n; i++) {
      const it = run.market.items.filter((x) => !x.sold).sort((a, b) => marketPrice(run, a) - marketPrice(run, b))[0];
      if (!it) break; const r = buyMarket(run, it.id); if (!r.ok) break; bought++; spent += r.price;
    }
    return { bought, spent };
  }
  const SAVE_VERSION = 1;
  const save = (run) => JSON.stringify({ v: SAVE_VERSION, run });
  function load(str, rand = Math.random) {
    const d = JSON.parse(str); if (!d || d.v !== SAVE_VERSION || !d.run) return null;
    const base = newRun(rand), run = Object.assign(base, d.run, { rand });
    run.frenzy = null; run.snap = null; run.next = run.next || {};
    for (const k of ['swords', 'relics', 'orders']) if (!Array.isArray(run[k])) return null;
    return run;
  }
  const swordById = (run, id) => (run.anvil && run.anvil.id === id ? run.anvil : run.swords.find((s) => s.id === id));

  // ── 铁砧 ──
  function putOnAnvil(run, id) {
    const i = run.swords.findIndex((s) => s.id === id);
    if (i < 0 || run.anvil) return false;
    run.anvil = run.swords.splice(i, 1)[0]; return true;
  }
  function takeOffAnvil(run) { if (!run.anvil) return false; run.swords.push(run.anvil); run.anvil = null; return true; }
  const snapshot = (run) => JSON.stringify({ sword: run.anvil, next: run.next, frenzy: run.frenzy, wire: run.dayFlags.wire });
  const frenzyLen = (run) => FRENZY_SEC + (has(run, 'long_sand') ? 1 : 0) + (has(run, 'lamp_wick') ? 2 : 0);
  const strikeCooldown = (run) => (run.anvil && frenzyOn(run, run.anvil) ? FRENZY_CD : STRIKE_CD / (has(run, 'rough_grip') ? 1.12 : 1));

  function strike(run) {
    const s = run.anvil;
    if (run.over || !s) return { result: 'none' };
    run.snap = snapshot(run);
    const gradeBefore = s.grade, valueBefore = valueOf(run, s);
    let startedFrenzy = false;
    if (!frenzyOn(run, s) && s.charge >= FRENZY_NEED) { run.frenzy = { id: s.id, left: frenzyLen(run) }; s.charge = 0; startedFrenzy = true; }
    if (startedFrenzy) run.frenzy.hits = 0;
    const inFz = frenzyOn(run, s);
    if (inFz) {

function step(dt0) {

  if (hammerT < 1) hammerT = Math.min(1, hammerT + dt / (hitFast ? 0.09 : 0.3));
  if (Math.random() < dt * 9) embers.push({ x: furnacePt()[0] + (Math.random() - 0.5) * W * 0.12, y: furnacePt()[1] + (Math.random() - 0.3) * 20, vx: (Math.random() - 0.3) * 24, vy: -(24 + Math.random() * 46), life: 1.6 + Math.random(), r: 0.8 + Math.random() * 1.6, h: Math.random() });
  for (let i = embers.length - 1; i >= 0; i--) { const e = embers[i]; e.life -= dt; if (e.life <= 0) { embers.splice(i, 1); continue; } e.x += e.vx * dt + Math.sin(clock * 3 + i) * 0.3; e.y += e.vy * dt; }

  const st = $('stage'); st.style.transform = shake > 0.02 ? `translate(${((Math.random() - 0.5) * shake * 7).toFixed(1)}px,${((Math.random() - 0.5) * shake * 7).toFixed(1)}px)` : '';
}

// ── 提示 ──
function float(text, color) { const el = document.createElement('div'); el.className = 'float'; el.textContent = text; el.style.color = color; el.style.left = 38 + Math.random() * 24 + '%'; $('stage').appendChild(el); setTimeout(() => el.remove(), 980); }
function toast(text, bad) { const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = text; document.body.appendChild(el); setTimeout(() => el.remove(), 2050); }

// ── 操作 ──
const OUT = { success: ['精进', '#9be28f'], great: ['飞跃', '#ffd36a'], hold: ['平稳', '#f3e7d3'], damage: ['磨损', '#ff9a86'], break: ['崩裂！', '#ff4a2b'], saved: ['保住了', '#7fd4ff'] };
function autoLoad() { if (!run.anvil) { const s = run.swords.slice().sort((a, b) => b.grade - a.grade)[0]; if (s) Forge.putOnAnvil(run, s.id); } }
const vib = (p) => { try { if (vibOn && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(p); } catch (e) {} };
function ring(x, y, c, v, r0 = 6) { rings.push({ x, y, r: r0, v, life: 1, c }); }
function bumpCombo(n) { const el = $('combo'); el.textContent = '×' + n; el.style.display = 'block'; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function doStrike() {
  if (modal || run.over || !run.anvil) return;
  const now = performance.now(); if (now - lastStrike < Forge.strikeCooldown(run) * 1000) return;
  lastStrike = now; audio();
  const an = anchor(), r = Forge.strike(run); if (r.result !== 'ok') return;
  heat = 1; impact = 1; zoomK = 1;
  if (r.startedFrenzy) { hitFast = true; sfx.frenzy(); flashA = 0.5; shake = 1; toast('爆燃！狂点锤子！'); vib([30, 20, 30]); ring(an.x, an.y, '127,212,255', 260, 10); $('stage').classList.add('fz'); }
  hammerT = 0;
  if (r.outcome === 'hit') {
    combo = r.hits; bumpCombo(r.hits); sfx.hit(r.hits);
    shake = Math.min(1, 0.45 + r.hits * 0.012); spawnSparks(an.x - 6, an.top, 7, '200,235,255'); ring(an.x, an.y, '200,235,255', 190, 8);
    if (r.hits % (run.relics.includes('glass_sand') ? 5 : 6) === 0) { flashA = 0.25; float('+1 级', '#7fd4ff'); bursts.push({ x: an.x, y: an.y, r: 20, life: 1, rot: Math.random(), c: '200,240,255' }); vib(20); } else vib(6);
    return;
  }
  if (r.outcome === 'break') {
    sfx.shatter(); shake = 1.6; freeze = 0.13; flashA = 0.55; spawnShards(an.x, an.y); heat = 0; ring(an.x, an.y, '255,90,60', 300, 10); float('崩裂！', OUT.break[1]); vib([40, 30, 80]);
  } else {
    const k = r.outcome; (k === 'success' || k === 'great' ? sfx.strike : k === 'damage' ? sfx.damage : sfx.hold)(k);
    shake = k === 'great' ? 1.3 : k === 'success' ? 0.75 : 0.45; freeze = k === 'great' ? 0.08 : k === 'success' ? 0.04 : 0.02;
    spawnSparks(an.x - 8, an.top, k === 'great' ? 34 : k === 'success' ? 16 : 6, k === 'great' ? '255,241,192' : '255,154,58');
    ring(an.x, an.y, k === 'great' ? '255,220,120' : '255,170,80', k === 'great' ? 280 : 190, 8);
    if (k === 'great') { flashA = 0.4; bursts.push({ x: an.x, y: an.y, r: 20, life: 1, rot: Math.random(), c: '255,230,150' }); vib(35); } else vib(k === 'success' ? 14 : 8);
    const dg = r.gradeAfter - r.gradeBefore; let txt = OUT[k][0];
    if (k === 'saved') txt = `保住了（${r.prevented}）`; else if (dg !== 0) txt += ` ${dg > 0 ? '+' : '−'}${Math.abs(dg)}`;
    float(txt, OUT[k][1]);
    if (r.prevented && k !== 'saved') toast(`${r.prevented}：崩裂变成磨损`);

}
function doOff() { if (modal) return; if (run.anvil) Forge.takeOffAnvil(run); else autoLoad(); }
// ── 弹窗 ──
function closeModal() { modal = null; $('modalRoot').innerHTML = ''; last = performance.now(); autoLoad(); }
function showModal(html) { modal = 'open'; const root = $('modalRoot'); root.innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`; return root; }
const ico = (id, emoji) => `<img class="ico" src="art/icons/${id}.png" alt="" onerror="this.replaceWith(document.createTextNode('${emoji}'))">`;
const toolRow = (r, right = '') => `<div class="row"><div class="ic">${ico(r.id, r.icon)}</div><div class="grow"><b>${r.name}</b><small>${r.desc}</small></div>${right}</div>`;
const BIG = 'padding:12px;font-family:var(--serif);font-size:16px;letter-spacing:.2em';

function openHelp() {
  showModal(`<h2>怎么玩</h2><ul class="rules">
    <li>你是一家小铁匠铺的老板。<b>每天早上送你 3 把 +0 的剑</b>。核心就是<b>锻造升级 → 卖出赚钱</b>，再用赚的钱去市场买更好的武器接着锻。</li>
    <li><b>市场</b>每天刷新一批武器。买价是价值的 1.3 倍，卖价是 0.85 倍，所以必须靠锻造把等级打上去才赚钱。</li>
    <li>点「锻打」<b>纯抽签，不用瞄准</b>：<b>精进 +1 级</b>、<b>飞跃 +2 级</b>、<b>平稳</b>、<b>磨损 −1 级</b>、<b>崩裂</b>（剑没了，钱也没了）。铁砧上方显示下一锤的精确概率。</li>
    <li>每锤填一格爆燃条，满 8 格后下一锤进入<b>爆燃 5 秒</b>：<b>可以疯狂连点</b>，不会崩裂，每 6 次连击 +1 级。</li>
    <li><b>订单</b>：客人要「+N 以上的剑」，给的钱比市场卖价高，等级超过要求还有额外奖励。</li>
    <li><b>工具</b>是铺子的永久升级，改变签库和收益，工具架只有 ${Forge.SHELF} 格。<b>杂货商</b>第 ${Forge.GROCER_EVERY} 天起每 ${Forge.GROCER_EVERY} 天来一次，卖一次性消耗品。</li>
    <li>每天结束要付<b>房租</b>，每天涨 20%。付不起就欠租 +1，欠满 ${Forge.MAX_MISS} 次铺子就被收走。连续 3 天付清可以抵掉 1 次欠租。</li>
    <li>名号看总资产：学徒 → 匠人 → 名匠 → 宗师 → <b>传奇</b>。</li>
    <li>电脑：<b>空格</b> 锻打（爆燃时可以按住不放），<b>R</b> 用回溯沙漏。</li></ul>
    <div class="dim">规则、工具和数值均为原创设计，画面与音效为自制。</div>
    <button class="buy" id="hc" style="${BIG}">开始</button>`);
  $('hc').onclick = () => { store.set('seen', true); closeModal(); };
}

const tierOf = (g) => (g >= 20 ? 4 : g >= 15 ? 3 : g >= 10 ? 2 : g >= 5 ? 1 : 0);
const thumb = (g) => `<img class="th" src="art/sword_${tierOf(g)}.png" alt="" onerror="this.style.visibility='hidden'">`;
function openMarket(tab0) {
  const root = showModal(''); let tab = tab0 || 'buy'; store.set('visitedMkt', true);
  const render = (note) => {
    const m = run.market, gs = new Map();
    for (const it of m.items) if (!it.sold) { const k = it.name + '|' + it.grade; if (!gs.has(k)) gs.set(k, { it, n: 0 }); gs.get(k).n++; }
    const buy = [...gs.values()].map(({ it, n }) => { const price = Forge.marketPrice(run, it), v = Forge.valueOf(run, { grade: it.grade, baseMul: it.baseMul, greats: 0, flat: 0, valMul: 1 });
      const hint = it.grade < 5 ? `锻到 +5 约可卖 <b>${fmtG(Forge.sellPrice(run, { grade: 5, baseMul: it.baseMul, greats: 0, flat: 0, valMul: 1 }))}</b>` : `现在卖 ${fmtG(Forge.sellPrice(run, { grade: it.grade, baseMul: it.baseMul, greats: 0, flat: 0, valMul: 1 }))}`;
      return `<div class="row mrow">${thumb(it.grade)}<div class="grow"><b>${it.name} +${it.grade}${n > 1 ? ` ×${n}` : ''}</b><small>价值 ${fmtG(v)} G · ${hint}</small></div><button class="buy" data-buy="${it.id}" ${run.gold < price ? 'disabled' : ''}>${fmtG(price)}</button></div>`; }).join('') || '<div class="dim">今天的货都被买光了，明天再来。</div>';
    const sg = new Map();
    for (const x of run.swords) { const k = [x.name, x.grade, x.cost, Forge.valueOf(run, x), x.charge].join('|'); if (!sg.has(k)) sg.set(k, { x, ids: [] }); sg.get(k).ids.push(x.id); }
    const sell = [...sg.values()].sort((a, b) => b.x.grade - a.x.grade).map(({ x, ids }) => {
      const price = Forge.sellPrice(run, x), diff = x.cost ? price - x.cost : null;
      return `<div class="row mrow">${thumb(x.grade)}<div class="grow"><b>${x.name} +${x.grade}${ids.length > 1 ? ` ×${ids.length}` : ''}</b><small>价值 ${fmtG(Forge.valueOf(run, x))} G${diff !== null ? ` · 成本 ${fmtG(x.cost)} · ${diff >= 0 ? `<b>赚 ${fmtG(diff)}</b>` : `<span class="lo">亏 ${fmtG(-diff)}</span>`}` : ''}</small></div>
        <div style="display:flex;flex-direction:column;gap:4px"><button class="buy" data-sell="${ids[0]}">卖 ${fmtG(price)}</button>${ids.length > 1 ? `<button class="buy ghost" data-sellall="${ids.join(',')}" style="padding:4px 8px;font-size:12px">全卖 ${ids.length}</button>` : ''}</div></div>`; }).join('') || '<div class="dim">手上没有可以卖的剑（铁砧上的要先「放下」）</div>';

      ? `<button class="buy ghost" id="bulkbuy" ${run.gold < 1 ? 'disabled' : ''}>补货：买最便宜的 3 把</button>`
      : `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="buy ghost" id="sell0">卖掉所有 +0</button><button class="buy ghost" id="sellall">卖掉手上全部</button></div>`;
    root.querySelector('.sheet').innerHTML = `<h2>武器市场</h2>
      <div class="dim">你有 <b class="gold">${fmtG(run.gold)}</b> G。买价 = 价值 ×${run.relics.includes('discount_seal') ? '1.2' : '1.3'}（每买一把再涨 6%），卖价 = 价值 ×${run.relics.includes('pawn_hook') ? '0.92' : '0.85'}。${note ? `<br><b class="gold">${note}</b>` : ''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="buy ${tab === 'buy' ? '' : 'ghost'}" id="tbuy">买入</button><button class="buy ${tab === 'sell' ? '' : 'ghost'}" id="tsell">卖出</button></div>

    root.querySelectorAll('[data-buy]').forEach((b) => b.onclick = () => { const r = Forge.buyMarket(run, +b.dataset.buy); if (r.ok) { sfx.coin(); render('买到了'); } else render(r.why || ''); });

        <div style="display:flex;gap:6px;flex-wrap:wrap">${fits.map((x) => `<button class="buy" data-o="${o.id}" data-s="${x.id}">交 +${x.grade} → ${fmtG(Forge.orderPay(run, o, x))}</button>`).join('') || '<span class="dim" style="font-size:12px">手上还没有够等级的剑</span>'}</div></div>`; }).join('') || '<div class="dim">今天没有订单，明天再来看看。</div>';

    root.querySelectorAll('[data-o]').forEach((b) => b.onclick = () => { const r = Forge.fulfillOrder(run, +b.dataset.o, +b.dataset.s); if (r.ok) { sfx.coin(); render(`收到 ${fmtG(r.gold)} G`); } else render(r.why || ''); });

function openGrocer() {

      ${run.grocer.items.map((it) => { const left = it.stock - it.bought, price = Forge.grocerPrice(run, it);

function openEndDay() {

    <div class="dim">${ok ? '付完房租，新的一天市场和订单会刷新。' : `金币不够！欠租 +1（现在 ${run.miss}/${Forge.MAX_MISS}），满 ${Forge.MAX_MISS} 次铺子就被收走。先去市场卖点东西吧。`}</div>
    <button class="buy" id="ring" style="${BIG}">${ok ? '付房租，结束今天' : '欠租，结束今天'}</button>

}
function openDayEnd(r) {

    ${r.interest ? `<div class="dim">利息簿：+${fmtG(r.interest)} G</div>` : ''}${r.forgiven ? '<div class="gold">连续 3 天付清房租，抵掉 1 次欠租。</div>' : ''}
    ${r.legend ? '<div class="gold">你的总资产达到了传说级别，成为了「传奇铁匠」！可以继续经营。</div>' : ''}

}
function openOver() {

  showModal(`<h2>铺子被收走了</h2><div class="dim">欠租满 ${Forge.MAX_MISS} 次。</div>
    <div class="stats"><div class="dim">撑到第几天<b class="gold">${run.day}</b></div><div class="dim">最高纪录<b>${best}${nb ? ' 🎉' : ''}</b></div>
    <div class="dim">名号<b>${rk.name}</b></div><div class="dim">最高等级<b>+${run.bestGrade}</b></div>

// ── HUD ──
const cache = {};
function setText(id, v) { if (cache[id] !== v) { cache[id] = v; $(id).textContent = v; } }
function setHTML(id, v) { if (cache[id] !== v) { cache[id] = v; $(id).innerHTML = v; } }
const lastCoach = { id: null };
let shownRank = null, shownRun = null;   // 名号徽章：换了一局（新开/读档）时静默更新，只有这一局里真的升级才提示
function hud() {
  const rent = Forge.rentOf(run.day), s = run.anvil, fz = s && Forge.frenzyOn(run, s), rk = Forge.rankOf(run);
  setText('dayno', run.day); setText('rent', rent.toLocaleString('en-US')); setText('gold', fmtG(run.gold)); setText('worth', fmtG(rk.worth) + (rk.next ? ' / ' + fmtG(rk.next[0]) : ''));
  setText('ranktitle', `${rk.name} · 今日房租`);
  if (shownRun !== run) { shownRun = run; shownRank = null; }
  if (shownRank !== rk.index) { const up = shownRank !== null && rk.index > shownRank; shownRank = rk.index; const ri = $('rankimg'); ri.src = `art/ranks/${rk.index}.png`; if (up) { ri.classList.remove('up'); void ri.offsetWidth; ri.classList.add('up'); sfx.win(); vib([30, 40, 60]); toast(`升为「${rk.name}」！`); float(`升为「${rk.name}」`, '#ffd36a'); } }
  const enough = run.gold >= rent; setText('rentnote', enough ? '够交 ✓' : `还差 ${fmtG(rent - run.gold)}`); $('rentnote').classList.toggle('bad', !enough);
  $('pfill').style.width = Math.min(100, run.gold / Math.max(1, rent) * 100) + '%'; $('pbar').classList.toggle('ok', enough);
  $('rfill').style.width = (rk.next ? Math.max(0, Math.min(100, (rk.worth - Forge.RANKS[rk.index][0]) / (rk.next[0] - Forge.RANKS[rk.index][0]) * 100)) : 100) + '%';
  document.querySelectorAll('#flames .fl').forEach((el, i) => el.classList.toggle('on', i < run.miss));

    else setHTML('odds', `<div class="brk"><b>${pct(o.break)}</b>崩裂</div><div><b>${pct(o.damage)}</b>磨损</div><div><b>${pct(o.hold)}</b>平稳</div><div class="suc"><b>${pct(o.success)}</b>精进</div><div class="grt"><b>${pct(o.great)}</b>飞跃</div>`);
    $('odds').classList.toggle('fz', o.frenzy);
    const sp = Forge.sellPrice(run, s), pf = s.cost ? sp - s.cost : null;
    setHTML('swinfo', `<div class="g">+${s.grade}</div><div class="v">${s.name} · 价值 ${fmtG(Forge.valueOf(run, s))}<br>卖 ${fmtG(sp)}${pf !== null ? ` <span class="pf ${pf >= 0 ? 'up' : 'down'}">${pf >= 0 ? '赚' : '亏'} ${fmtG(Math.abs(pf))}</span>` : ''}${run.next.ward ? ' 🧿' : ''}${run.next.blessing ? ' 🌟' : ''}${run.next.wager ? ' 💥' : ''}</div>`);
    setHTML('pips', '<span class="piplab">爆燃</span>' + Array.from({ length: Forge.FRENZY_NEED }, (_, i) => `<i class="${fz || i < s.charge ? 'on' : ''}"></i>`).join('')); $('pips').classList.toggle('fz', !!fz);
    $('fzbar').style.display = fz ? 'block' : 'none'; if (fz) $('fzfill').style.width = (run.frenzy.left / Forge.frenzyLen(run) * 100) + '%';
  } else { setHTML('odds', ''); setHTML('swinfo', ''); setHTML('pips', ''); $('fzbar').style.display = 'none'; }
  $('btnStrike').disabled = !s || !!modal;
  const cd = Math.max(0, 1 - (performance.now() - lastStrike) / (Forge.strikeCooldown(run) * 1000)); $('cdfill').style.width = cd * 100 + '%';
  const offTxt = s ? '放下' : '拿起'; if (cache.off !== offTxt) { cache.off = offTxt; $('btnOff').textContent = offTxt; }
  // 剑堆：相同的合并成 ×N，按等级从高到低，带剑的小图
  const gm = new Map();
  for (const x of run.swords) { const k = [x.name, x.grade, x.charge, x.flat, x.greats, x.cost, Forge.valueOf(run, x)].join('|'); if (!gm.has(k)) gm.set(k, { x, n: 0 }); gm.get(k).n++; }
  setHTML('tray', [...gm.values()].sort((a, b) => b.x.grade - a.x.grade || Forge.valueOf(run, b.x) - Forge.valueOf(run, a.x)).map(({ x, n }) => `<button class="sw" data-id="${x.id}">${n > 1 ? `<span class="qty">×${n}</span>` : ''}<img class="sg" src="art/sword_${tierOf(x.grade)}.png" alt="" onerror="this.style.visibility='hidden'"><b>+${x.grade}</b><small>${fmtG(Forge.valueOf(run, x))}</small></button>`).join('') || '<span class="noswords">手上没有别的剑，明早会送 3 把，也可以去市场买</span>');
  setHTML('cons', Object.entries(run.cons).map(([id, n]) => `<button class="cn" data-c="${id}">${ico(id, Forge.CONS[id].icon)} ${Forge.CONS[id].name} ×<b>${n}</b></button>`).join(''));
  setHTML('toolrow', Array.from({ length: Forge.SHELF }, (_, i) => { const id = run.relics[i]; return id ? `<button class="tl" data-tl="${id}">${ico(id, Forge.BY_ID[id].icon)}</button>` : '<span class="tl em"></span>'; }).join(''));
  $('obadge').hidden = !run.orders.some((o) => run.swords.some((x) => x.grade >= o.grade));
  $('tbadge').hidden = !(run.relics.length < Forge.SHELF && run.tools.offers.some((id) => run.gold >= Forge.toolPrice(run, id) + rent * 2));
  $('gbadge').hidden = !run.grocer; $('navGro').style.opacity = run.grocer ? 1 : 0.5;
  coachTick();
}
// ── 新手提示：按顺序一次一条，做完就消失，不再出现 ──
const TOUR = [
  { id: 't1', target: 'btnStrike', text: '点「锻打」锤一下试试。每一锤都是抽签，结果看上面的概率栏。', show: () => run.forged === 0, done: () => run.forged >= 1 },
  { id: 't2', target: 'odds', text: '上面是下一锤的精确概率。「崩裂」会让剑直接消失，等级越高越容易崩，要自己掂量什么时候收手。', show: () => run.forged >= 1, done: () => run.forged >= 5 || run.broken >= 1 },
  { id: 't3', target: 'pips', text: '下面的条每锤填一格，满 8 格后进入「爆燃」：5 秒内不会崩裂，可以疯狂连点（也可以按住不放）！', show: () => run.anvil && run.anvil.charge >= 6, done: () => !!run.frenzy || run.forged >= 40 },
  { id: 't4', target: 'navMkt', text: '锻得差不多了，去「市场」把剑卖掉换钱，再买新的接着锻。', show: () => run.forged >= 8, done: () => !!store.get('visitedMkt', false) },
  { id: 't5', target: 'wax', text: '每天结束要付房租。钱够了（账本上有绿色的「够交 ✓」）就点「结束今天」。', show: () => !!store.get('visitedMkt', false) && run.day === 1, done: () => run.day >= 2 },
  { id: 't6', target: 'navOrd', text: '客人的订单报酬比市场卖价高，手上的剑等级够了就来交。', show: () => run.day >= 2 && run.orders.some((o) => run.swords.some((x) => x.grade >= o.grade)), done: () => run.ordersDone >= 1 },
  { id: 't7', target: 'navTool', text: '工具是铺子的永久升级，能改变签库。攒够钱去买一个。', show: () => run.day >= 2 && run.gold >= 900 && run.relics.length === 0, done: () => run.relics.length >= 1 },
];
let tourDone = new Set(store.get('tour', []));
const finishTour = (id) => { tourDone.add(id); store.set('tour', [...tourDone]); };
let coachAt = 0;
function coachTick() {
  const now = performance.now(); if (now - coachAt < 250) return; coachAt = now;
  const box = $('coach'), step = TOUR.find((t) => !tourDone.has(t.id));
  const clear = () => { if (lastCoach.id) { const el = $(lastCoach.target); if (el) el.classList.remove('pulse'); } lastCoach.id = null; lastCoach.target = null; box.hidden = true; };
  if (!step || modal || run.over) { clear(); return; }
  if (step.done()) { finishTour(step.id); clear(); return; }
  if (!step.show()) { clear(); return; }
  if (lastCoach.id !== step.id) { clear(); lastCoach.id = step.id; lastCoach.target = step.target; $('coachtxt').textContent = step.text; box.hidden = false; $(step.target).classList.add('pulse'); }
}
$('coachok').onclick = () => { if (lastCoach.id) { finishTour(lastCoach.id); const el = $(lastCoach.target); if (el) el.classList.remove('pulse'); lastCoach.id = null; $('coach').hidden = true; } };
$('toolrow').addEventListener('click', (e) => { const b = e.target.closest('[data-tl]'); if (!b) return; const r = Forge.BY_ID[b.dataset.tl]; toast(`${r.name}：${r.desc}`); });
$('tray').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (!b || modal) return; const id = +b.dataset.id; if (run.anvil) Forge.takeOffAnvil(run); Forge.putOnAnvil(run, id); });
$('cons').addEventListener('click', (e) => { const b = e.target.closest('[data-c]'); if (!b || modal) return; const r = Forge.useConsumable(run, b.dataset.c); if (r.ok) { sfx.coin(); if (b.dataset.c === 'undo') toast('撤销了上一锤'); } else toast(r.why || '现在不能用', true); });

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!modal && !run.over && !document.hidden) { const ev = Forge.tick(run, dt); if (ev && ev.event === 'frenzyEnd') { hitFast = false; combo = 0; $('combo').style.display = 'none'; $('stage').classList.remove('fz'); toast(`爆燃结束：${ev.hits} 连击，+${ev.levels} 级`); float(ev.levels ? `+${ev.levels} 级` : '爆燃结束', '#7fd4ff'); } }
  step(dt); draw(); hud(); requestAnimationFrame(frame);
}
let holdTimer = null; const stopHold = () => { if (holdTimer) { clearInterval(holdTimer); holdTimer = null; } };
$('btnStrike').addEventListener('pointerdown', (e) => { e.preventDefault(); doStrike(); stopHold(); if (holdSpam) holdTimer = setInterval(() => { if (!modal && run.anvil && Forge.frenzyOn(run, run.anvil)) doStrike(); }, 55); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) $('btnStrike').addEventListener(ev, stopHold);
addEventListener('blur', stopHold);
$('btnOff').onclick = doOff;
const guard = (fn) => () => { if (!modal && !run.over) fn(); };
$('wax').onclick = guard(openEndDay);
$('navMkt').onclick = guard(() => openMarket());
$('navOrd').onclick = guard(openOrders);

$('help').onclick = () => { if (!modal) openHelp(); };
$('gear').onclick = () => { if (!modal) openSettings(); };
$('mute').onclick = () => { muted = !muted; store.set('muted', muted); $('mute').textContent = muted ? '🔇' : '🔊'; if (!muted) { audio(); sfx.coin(); } };
$('mute').textContent = muted ? '🔇' : '🔊';
addEventListener('keydown', (e) => {
  if (e.repeat && !(run.anvil && Forge.frenzyOn(run, run.anvil))) return;
  if (e.code === 'Space') { e.preventDefault(); doStrike(); }
  else if (e.code === 'KeyR' && !modal) { const r = Forge.useConsumable(run, 'undo'); if (r.ok) toast('撤销了上一锤'); }
});
function openSettings() {

      <h3>这一局</h3>
      <div class="stats"><div class="dim">天数<b>${run.day}</b></div><div class="dim">名号<b>${rk.name}</b></div><div class="dim">总资产<b>${fmtG(rk.worth)}</b></div><div class="dim">最高等级<b>+${run.bestGrade}</b></div>
      <div class="dim">累计卖出<b>${run.sold}</b></div><div class="dim">完成订单<b>${run.ordersDone}</b></div><div class="dim">锻打次数<b>${run.forged}</b></div><div class="dim">崩裂<b>${run.broken}</b></div>
      <div class="dim">单笔最高收入<b>${fmtG(run.bestSale)}</b></div><div class="dim">历史最高天数<b>${Math.max(best, run.day)}</b></div></div>

    root.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => {

      if (t === 'vib') { vibOn = !vibOn; store.set('vib', vibOn); if (vibOn) vib(30); }

}

    <div class="stats"><div class="dim">天数<b>${saved.day}</b></div><div class="dim">名号<b>${rk.name}</b></div><div class="dim">金币<b>${fmtG(saved.gold)}</b></div><div class="dim">欠租<b>${saved.miss}/${Forge.MAX_MISS}</b></div></div>

resize(); autoLoad();
{ const saved = loadSaved(); if (saved && !saved.over && (saved.day > 1 || saved.forged > 0 || saved.sold > 0)) { if (saved.day > 1) for (const t of TOUR) finishTour(t.id); savingOn = false; openContinue(saved); } }
setInterval(saveGame, 1500); addEventListener('pagehide', saveGame); document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
